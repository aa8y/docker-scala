schemaVersion: "2.0.0"

# Applied to tags whose `scalac -version` writes the banner to stdout.
# Currently: Scala 2.12, 2.13, and 3.8. See version-stderr.yaml for the
# longer history — the stream has flipped multiple times. The excludedError
# clause guards the stream boundary so a flip surfaces as a test failure
# rather than a silently wrong assertion.

commandTests:
  - name: "scalac -version writes the banner to stdout"
    command: "scalac"
    args: ["-version"]
    expectedOutput: ["version [23]\\.[0-9]+\\.[0-9]+"]
    excludedError: ["version [23]\\."]
