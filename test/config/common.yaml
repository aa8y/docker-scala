schemaVersion: "2.0.0"

# Shared assertions for every aa8y/scala image: install layout, the
# build-arg-driven entrypoint wrapper, and a scalac compile+run round-trip
# (which works on every supported minor, including 2.10 where the REPL is
# broken). The `scalac -version` check lives in version-stderr.yaml /
# version-stdout.yaml because the stream changed between 2.11 and 2.12.

metadataTest:
  entrypoint: ["/usr/local/bin/scala-entrypoint"]

fileExistenceTests:
  - name: "/opt/scala/bin/scala exists"
    path: "/opt/scala/bin/scala"
    shouldExist: true
  - name: "/opt/scala/bin/scalac exists"
    path: "/opt/scala/bin/scalac"
    shouldExist: true
  - name: "/bin/scala symlink exists"
    path: "/bin/scala"
    shouldExist: true
  - name: "/bin/scalac symlink exists"
    path: "/bin/scalac"
    shouldExist: true
  - name: "entrypoint wrapper exists"
    path: "/usr/local/bin/scala-entrypoint"
    shouldExist: true

commandTests:
  - name: "scalac compiles a Hello source"
    # Compile-only; we don't try to run the .class because the `scala` runner
    # CLI changed in 3.8 (subcommand-based scala-cli, no more `scala Hello`),
    # and the REPL test in repl.yaml already exercises the runner side of
    # things on every tag that ships a working REPL.
    # `def main` (not `extends App`) works on every supported minor: App is
    # deprecated in Scala 3 and would print a warning to stderr.
    command: "sh"
    args:
      - "-c"
      - 'cd "$(mktemp -d)" && printf ''object Hello { def main(args: Array[String]): Unit = println("ok") }'' > Hello.scala && scalac Hello.scala && ls Hello*.class | head -1'
    expectedOutput: ["Hello.*\\.class"]

  - name: "entrypoint wrapper resolves to scala or scalac"
    command: "sh"
    args: ["-c", "readlink /usr/local/bin/scala-entrypoint"]
    expectedOutput: ["(?m)^/opt/scala/bin/scalac?$"]
