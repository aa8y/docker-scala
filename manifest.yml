parameters:
  repository: aa8y/scala
templates:
  build: docker build -t {{{repository}}}:{{tag}} --build-arg SCALA_VERSION={{version}} --build-arg SCALA_BIN={{scalaBin}} {{{context}}}
  push: docker push {{{repository}}}:{{tag}}
structureTest:
  configs:
    - test/config/common.yaml
contexts:
  .:
    tags:
      '2.10':
        version: 2.10.7
        scalaBin: scalac
      '2.11':
        version: 2.11.12
        scalaBin: scala
        structureTest:
          configs:
            - test/config/repl.yaml
      '2.12':
        version: 2.12.8
        scalaBin: scala
        structureTest:
          configs:
            - test/config/repl.yaml
      latest:
        version: 2.12.8
        scalaBin: scala
        structureTest:
          configs:
            - test/config/repl.yaml
