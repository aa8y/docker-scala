        structureTest:
          configs:
            - test/config/repl.yaml
            - test/config/version-stdout.yaml
      lts:
        version: 3.3.8
        jdk: '21'
        scalaBin: scala
        structureTest:
          configs:
            - test/config/repl.yaml
            - test/config/version-stderr.yaml
      latest:
